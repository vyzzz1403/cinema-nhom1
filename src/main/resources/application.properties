spring.application.name=movie-sv
server.port=8080

# ===============================
# 1. CẤU HÌNH MYSQL DATABASE
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/movie_sv_db?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
# Nếu bạn dùng XAMPP thì mật khẩu thường để trống như bên dưới. 
# Nếu MySQL của bạn có mật khẩu (ví dụ: 123456) thì hãy điền vào sau dấu =
spring.datasource.password=

# ===============================
# 2. CẤU HÌNH JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# 3. CẤU HÌNH RABBITMQ
# ===============================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.auto-startup=false

# REDIS CONFIGURATION
spring.data.redis.host=localhost
spring.data.redis.port=6379